# Changes to the simulation itself that aren't part of any one experiment, such as a new prompt
# version for new runs. The doors page changelog shows them with each experiment's start and its
# mid-run changes, all newest first. A run keeps the wording it started with unless switched on
# purpose, and that switch shows up under the run.
- time: 2026-11-08 23:49
  what: "test1: prompt version 12 and long-term memory"
  when: test1 only, from day 8 (the original checkpoint is checkpoint.pkl.before-v12-memory)
  details:
    - "prompt version 11 -> 12, with its world: recipe cards cheaper (tools 500 -> 200, the daily card 2000 -> 800) and every tool for sale ready-made at 4x its sell value. Everyone still lives in a tent, so nothing had to move out of anyone's pockets; the board's posts got numbers"
