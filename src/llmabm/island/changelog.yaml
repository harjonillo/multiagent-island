# Changes to the simulation itself that aren't part of any one experiment, such as a new prompt
# version for new runs. The doors page changelog shows them with each experiment's start and its
# mid-run changes, all newest first. A run keeps the wording it started with unless switched on
# purpose, and that switch shows up under the run.
- time: 2026-11-13 12:00
  what: Prompt version 18, trades name both people
  when: new runs from now on, or a run resumed with --prompt-version 18; the record, for every run
  details:
    - "a conversation's reply writes a trade as \"you give <them>\" and \"<them> gives you\" (was \"give\" and \"want\"; both are still read). In test1, 12 of 18 replies to an offer on the table asked for the same thing back (Ike offers wood for Ari's bait; Ari answers with fish for Ike's bait), 7 of them on days 9 to 11, after version 13's \"you give, you get\" table. Bo, asked by Ari for bait he didn't have, offered his own wood for Ari's bait, thinking \"Ari wants bait, gives wood\""
    - "the offer on the table, each turn's tag and what has changed hands between two villagers name who gives what to whom, never \"X for Y\": \"On the table from Ike: Ike gives you 1 wood, you give Ike 1 fishing bait (you have none)\"; \"you gave Jo 1 selit fish and Jo gave you 1 softwood, in a trade\". A request to you says how many of it you have"
    - "the record (day logs, the explorer) names both people too, rebuilt from what each turn did, so it reads that way for every run that kept it (from prompt version 12), test1 included once re-analysed: \"offered Kit a trade: Gus gives 1 selit fish, Kit gives 1 fishing bait\" (was \"offered a trade: 1 selit fish for 1 fishing bait\")"
    - "not changed, on purpose: who has what. In test1 at most one villager held any fishing bait at the end of each day from day 6 on, and nobody knew its recipe, so most bait trades couldn't have happened however they were worded"
- time: 2026-11-12 18:00
  what: Prompt version 17, more bridges, and stairs
  when: new runs from now on, or a run resumed with --prompt-version 17
  details:
    - "anyone can propose a bridge across the river, or stairs up a cliff, right where they stand (propose_bridge, propose_stairs). It's free and takes the hour. The island picks the nearest workable spot within 8 tiles, at least 6 tiles from any other bridge or stairs; with none there, it fails and says where the nearest one is"
    - "bridges and stairs take up room: a bridge is 3 tiles wide, crossing at most 4 tiles of lower river (test1's river averages 3.1 across, 3.2 on lower ground) with a landing on each bank; stairs are 2 wide and 4 long, two rows below a cliff edge and two above. The first bridge gets the same 3-wide footprint (it was a 2-tile strip). Every land tile under one has to be clear, and from the moment it's proposed it's a construction site: walkable, but nothing can be planted or put on it, and no tree or rock turns up there. Test1's island has 28 bridge spots and 130 stairs spots"
    - "each is built once its own fund at Resident Services reaches 98,000 bells, the first bridge's cost. Several funds can be open at once, and each is its own line on a villager's list (\"put bells toward the stairs up to the middle cliff (north) (0/98000 raised, Ari's proposal)\"). A built bridge crosses the river like the first; built stairs let anyone climb that cliff edge without a ladder."
    - "at most 10 bridges and stairs on the island, built or proposed, the first bridge included; each villager has at most one proposal still being funded"
    - "plans list every bridge and stairs with who proposed it and what's raised, Tom Nook says anyone can propose more and how many there are, and the action list says what proposing needs. The map shows proposed sites and built bridges and stairs, and the summary lists them"
    - "bridges and stairs only give access. Before, the first bridge also added 3 rocks and 10 hardwood trees at random places on the island when built, and Tom Nook (28 times in test1) and a fun fact said it \"opens more rocks and trees to everyone\"; villagers planned around a \"bridge rock\". Now Tom Nook says only that it crosses the river so nobody needs a vaulting pole there, the fun fact says a funded bridge lets anyone cross without a pole, and a new one says funded stairs let anyone climb a cliff without a ladder"
- time: 2026-11-12 12:00
  what: Prompt version 16, actions by number
  when: new runs from now on, or a run resumed with --prompt-version 16
  details:
    - "each plan lists the actions the villager can do then, numbered and spelled out, worked out from what they carry, their bells, what they keep at home (for crafting), where they can walk with the tools they carry, and opening hours within the plan's hours. The plan picks by number, adding a count, bells or a place where an option takes one. Nothing else can be planned. In test1, days 7 to 11, actions failed on form (visiting Nook's Cranny or Tom Nook, walk, post, trade, asking a villager) or on what the villager didn't have yet (fishing with bait they didn't carry, bells, a way across the river)"
    - "the action menu in the island rules becomes a list of every kind of action and what each needs, without how to write it, so villagers know what exists before it is on their list"
    - "a pick that can't be read is dropped and the villager's day says so; a pick at a shop or service goes in the nearest hour it's open"
    - "the list is as of planning time: something an earlier pick in the same plan would bring (buying bait, then fishing with it) is on the next plan's list. The optional fish size and bug species are gone; going after a particular shadow or bug is the spot decision"
- time: 2026-11-10 22:00
  what: Prompt version 15, the island says what was missing
  when: new runs from now on (test1 ends at day 9 on version 14)
  details:
    - "places out of reach say which tool would get you there: \"plaza (out of reach without a vaulting pole)\" (was \"out of reach for you right now\"), and so do failed trips, visits and searches (\"you can't get to Able Sisters from here without a vaulting pole\"). In test1 every vaulting pole broke on days 5 and 6, and villagers guessed the ladder or a path would get them across"
    - "fishing with \"bait\": true and none in your pockets fishes without it and says so (\"no fishing bait in your pockets, so you fished without it: ...\"). In test1 it failed 88 times, still 7 on day 9 after version 13's menu wording, and villagers concluded they couldn't fish"
    - "rest and wear happen where you are when you can't get home (before, they failed walking home). Crafting stays at home, and the menu says so: \"craft: recipe (at home)\""
    - "a plan's non-action says where that happens instead: trade, give or talk (when you meet someone), post or letters (the plaza), home or store (the plan's \"home\" field), walk or travel (you walk wherever an action takes you)"
    - "common ways of writing an action are read as meant: \"Jo's home\" is Jo, \"Nook's Cranny\" is the cranny, \"shovel recipe card\" is the card, \"2 fishing bait\" and \"quantity\" are a count. buy takes a count (up to 10, stopping at the first that doesn't go through)"
    - "any visit to Nook's Cranny (buying, selling, asking) adds what Timmy and Tommy would pay for what you carry to the prices you've heard, without a word in the result. Nobody in test1 sold anything in 10 days, and 7 of 10 had heard no prices by day 9"
    - "clearer failures: an axe you don't carry says which one you do; chopping a kind of tree that doesn't exist says trees are hardwood or fruit and either gives all three woods; break_rock says the apple has to be in your pockets and that shaking a fruit tree drops them; a bridge contribution from an empty wallet says so"
    - "Tom Nook and the fun fact say the bridge crosses the river by Resident Services, so nobody needs a vaulting pole there. The world file calls it the bridge over the river (was the bridge to the north bank; it is on lower ground in the centre)"
    - "the fun facts start with tools breaking, the ladder and pole, Timmy and Tommy buying almost anything, clams and bait, the map, saplings and planting, and the bridge. Before, facts added in later versions came last, and test1 never heard the ones about clams, the ladder and pole, tools breaking or the map"
    - "stranded: a villager who is awake and can't get home with the tools they carry stays where they are in free hours (before, any free hour put them back home, whatever they carried); \"Getting around\" says \"Your home is out of reach without a vaulting pole (call_rescue, once a day)\". Falling asleep still brings everyone home"
    - "call_rescue: the Rescue Service takes a stranded villager home, free, once a day, using that hour, and gives them a talking-to about why they got stuck (which tool they lacked, that ladders and poles wear out on every trip that needs them, that their plans show the uses left, and that Nook's Cranny sells both and their recipe cards). A second call that day is turned down: they're home when they go to sleep. Calling when home is reachable doesn't come and doesn't use up the day's rescue"
    - "not changed, on purpose: nothing says stumps don't grow back, and nothing points at selling, the loan or planting"
- time: 2026-11-10 22:00
  what: Every prompt in the explorer, and a How they work tab
  when: every run's page; prompts for runs that kept them
  details:
    - "runs keep their prompts by default (--no-log-prompts turns it off; --log-prompts is still accepted). A villager's second call with the same tag gets its own file (<tag>_<name>_2.txt): before, each turn in a conversation hour overwrote the last, so test1 kept only a villager's last chat turn of each hour"
    - "Days: each villager's card has a Prompts section listing every call that day (plan, spotted something, someone nearby, conversation turn, plaza, nightly page), each opening to the system prompt, the prompt, the hidden reasoning and the reply. Prompts load a day at a time from prompts/day_NNN.js beside the page, which also works from disk"
    - "Days: all conversations that day fold away, closed by default"
    - "the map shows the bridge site (where the island generator put the crossing) until it's built, labelled, with the fund so far on hover"
    - "a How they work tab: the model and its settings, what carries over from day to day (the page, memories, notes, what the island keeps for them, energy), each kind of call with when it happens, what it decides, what its prompt starts with, how often it happens and an example, and the prompt versions by day with what changed mid-run"
    - "to publish a run's prompts, commit runs/<run>/prompts/ next to manifest.json and events.jsonl (the .gitignore lets it through)"
- time: 2026-11-09 23:00
  what: Prompt version 14, going after what you spot
  when: new runs from now on; running ones keep theirs unless resumed with --prompt-version 14
  details:
    - "when a bug or fish shadow first comes into view, a villager who carries the net or fishing rod for it, is awake the next hour and has an action for it (or an action planned then to give up) decides in a small call whether to go after it the next hour (PHASE: spot, charged as thinking). Going after it replaces what was planned for that hour; it uses one of the day's actions only if the hour was free"
    - "at most 3 such calls a villager a day (sightings.max_decisions_per_day). Logged as spot_decision. Shells and dig spots, which stay all day, don't ask"
    - "before, plans were the only way to act on a sighting: in test1 on day 7, Cal spotted 14 things and caught 1 fish"
- time: 2026-11-09 14:00
  what: Prompt version 13, trades in a conversation, shorter prompts and a clearer action menu
  when: new runs from now on; running ones keep theirs unless resumed with --prompt-version 13
  details:
    - "a conversation holds at most 3 trade offers, from both villagers together (like a villager in the game giving up after a few tries). Each turn says how many are left; after the third, \"trade\" is gone from the reply, and the last offer on the table can still be accepted"
    - "on day 8 of test1, Ike and Ari put 8 trades on the table in one conversation (neither had the bait both wanted) until Ari was too tired to talk"
    - "an offer past the third puts nothing on the table, tells both sides why, and is logged as trade_over"
    - "the trade on the table is spelled out: \"On the table from Ike: you give 1 fishing bait (you have none), you get 1 wood.\" Before, it read \"Ike offers you 1 wood for your 1 fishing bait\", and on day 8 Ike and Ari each read the other's offer as giving them bait"
    - "a trade offer's tag in the conversation reads the same way: \"[Ike's offer: you give 1 fishing bait, you get 1 wood]\", \"[your offer: you give 1 wood, you get 1 fishing bait]\" (was \"Ike offered you 1 wood for your 1 fishing bait\")"
    - "\"accept\" is offered only if the accepter's own pockets can hold up their side: enough of what they'd give, and room for what they'd get. Otherwise the line says \"You can't accept it\" (with \"(no room)\" when that's why). What the proposer lacks isn't checked, so nobody learns the other's pockets that way; such a trade still falls through when accepted"
    - "shorter prompts everywhere: no ordinance line when there is none and no loan line when nothing is owed; \"At home (a tent holds only bells): 0 bells\"; requests say \"(until day 8)\"; recipes \"log stool (wood x3; 7 in pockets)\"; \"Nook's Cranny buys at (prices you've heard)\"; and a shorter energy rule"
    - "a conversation leaves out what only plans use: rocks, buildings and trees with their distances (the first Getting around line and the island map stay), what you spotted, the museum, the bridge, what shop goods are, and the energy plan. Pockets are listed once, next to the reply, and the instructions are shorter. On test1's day 8 checkpoint a conversation turn goes from about 1,600 words to about 1,230"
    - "the action menu says bait uses 1 fishing bait from your pockets (leave it out if you have none), visit is for villagers (shops and services have their own actions), ask is for the NPCs only, and what isn't an action: talking, giving and trading (when you meet someone), the board, letters and parcels (at the plaza), and walking. Up to day 8 of test1, plans tried trade, post, talk, walk, travel or give as actions 22 times, fished with bait they didn't have 81 times, and tried to visit a building or NPC about 40 times"
    - "the action menu ends with what each tool is for: shovel (mine_rock, dig_fossil, dig_clam, dig_stump, break_rock); axe or stone axe (chop_wood); fishing rod (fish); net (catch_bug); ladder (climbs one cliff up or down); vaulting pole (jumps across the river), used on your way when you carry them. Every villager in test1 carries a ladder and none a vaulting pole, and several thought the ladder, or a better path, would get them across the river to the plaza"
    - "the same goes for offering one: an offer the proposer's own pockets can't hold up (not enough of what they'd give, or no room for what they'd get) isn't put on the table, counts as one of the 3, tells both sides why, and is logged as trade_cant_offer"
