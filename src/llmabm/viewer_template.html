<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow Viewer</title>
<style>
:root {
  --bg: #fcfcfb; --panel: #f4f3f0; --line: #e2e1dc; --edge: #d6d5cf;
  --text: #0b0b0b; --text-2: #52514e; --muted: #8a8984; --node-empty: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1a1a19; --panel: #232322; --line: #34332f; --edge: #3e3d39;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e86; --node-empty: #1a1a19; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
header { padding: 14px 16px 6px; }
h1 { font-size: 17px; margin: 0 0 2px; }
.sub { color: var(--text-2); font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); }
.controls label { color: var(--text-2); font-size: 13px; display: flex; gap: 6px; align-items: center; }
select, button { font: inherit; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
button { cursor: pointer; min-width: 64px; }
input[type=range] { width: min(320px, 50vw); }
#tickLabel { font-variant-numeric: tabular-nums; min-width: 64px; }
main { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(280px, 1fr); gap: 0; min-height: calc(100vh - 120px); }
@media (max-width: 800px) { main { grid-template-columns: 1fr; } }
#graphWrap { padding: 8px; }
svg { width: 100%; height: auto; display: block; }
.edge { stroke: var(--edge); stroke-width: 1; }
.flow { stroke-width: 2; fill: none; opacity: .9; }
.node { stroke: var(--muted); stroke-width: 1.5; cursor: pointer; }
.node.sel { stroke: var(--text); stroke-width: 3; }
.ring { fill: none; stroke-width: 2; }
.lbl { font-size: 13px; fill: var(--text-2); pointer-events: none; }
aside { border-left: 1px solid var(--line); padding: 12px 16px; overflow: auto; max-height: calc(100vh - 120px); }
@media (max-width: 800px) { aside { border-left: 0; border-top: 1px solid var(--line); max-height: none; } }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-2); margin: 14px 0 6px; }
.msg { border-left: 3px solid var(--muted); padding: 4px 8px; margin: 6px 0; background: var(--panel); border-radius: 0 6px 6px 0; }
.msg .meta { font-size: 12px; color: var(--text-2); }
.kv { font-size: 13px; color: var(--text-2); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--text-2); padding: 0 16px 8px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; border: 1px solid var(--muted); }
.empty { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="sub" id="desc"></div>
</header>
<div class="controls">
  <button id="play">Play</button>
  <input type="range" id="tick" min="0" value="0">
  <span id="tickLabel"></span>
  <label>Color by <select id="mode"></select></label>
</div>
<div class="legend" id="legend"></div>
<main>
  <div id="graphWrap"><svg id="g" viewBox="0 0 1000 760" role="img" aria-label="Agent network"></svg></div>
  <aside>
    <div id="agentPanel"><p class="empty">Click an agent to see what it read, believed and sent.</p></div>
    <h2>Messages sent this tick</h2>
    <div id="msgs"></div>
  </aside>
</main>
<script>
const D = /*__DATA__*/null;
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const seedColor = {}; D.seeds.forEach((s, i) => seedColor[s.id] = D.colors[i % D.colors.length]);
let tick = 0, selected = null, timer = null;

$("title").textContent = D.scenario;
$("desc").textContent = D.description;
$("tick").max = D.steps - 1;

// Layout: map spring positions into the viewBox.
const names = Object.keys(D.positions);
const xs = names.map(n => D.positions[n][0]), ys = names.map(n => D.positions[n][1]);
const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
const P = {}; names.forEach(n => P[n] = [60 + 880 * (D.positions[n][0] - x0) / ((x1 - x0) || 1), 50 + 660 * (D.positions[n][1] - y0) / ((y1 - y0) || 1)]);

const modes = [...D.seeds.map(s => ({key: "seed:" + s.id, label: "exposure to " + s.id})),
               ...Object.keys(D.probes).map(p => ({key: "probe:" + p, label: "probe: " + p}))];
modes.forEach(m => { const o = document.createElement("option"); o.value = m.key; o.textContent = m.label; $("mode").appendChild(o); });

const svg = $("g");
const gEdges = document.createElementNS(NS, "g"), gFlows = document.createElementNS(NS, "g"), gNodes = document.createElementNS(NS, "g");
svg.append(gEdges, gFlows, gNodes);
const defs = document.createElementNS(NS, "defs"); svg.prepend(defs);
[...D.colors, "var(--muted)"].forEach((c, i) => {
  defs.insertAdjacentHTML("beforeend", `<marker id="ah${i}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${c}"/></marker>`);
});
D.edges.forEach(([a, b]) => {
  const l = document.createElementNS(NS, "line");
  l.setAttribute("class", "edge"); l.setAttribute("x1", P[a][0]); l.setAttribute("y1", P[a][1]); l.setAttribute("x2", P[b][0]); l.setAttribute("y2", P[b][1]);
  gEdges.appendChild(l);
});
const nodeEl = {}, ringEl = {};
names.forEach(n => {
  const ring = document.createElementNS(NS, "circle"); ring.setAttribute("class", "ring"); ring.setAttribute("r", 15);
  ring.setAttribute("cx", P[n][0]); ring.setAttribute("cy", P[n][1]);
  const c = document.createElementNS(NS, "circle"); c.setAttribute("class", "node"); c.setAttribute("r", 10);
  c.setAttribute("cx", P[n][0]); c.setAttribute("cy", P[n][1]);
  c.addEventListener("click", () => { selected = n; render(); });
  const title = document.createElementNS(NS, "title"); title.textContent = n; c.appendChild(title);
  const t = document.createElementNS(NS, "text"); t.setAttribute("class", "lbl"); t.setAttribute("x", P[n][0] + 18); t.setAttribute("y", P[n][1] + 4); t.textContent = n;
  gNodes.append(ring, c, t); nodeEl[n] = c; ringEl[n] = ring;
});

function colorIdxFor(m) { const r = m.roots[0]; return r ? D.seeds.findIndex(s => s.id === r) % D.colors.length : D.colors.length; }
function msgColor(m) { const i = colorIdxFor(m); return i === D.colors.length ? "var(--muted)" : D.colors[i]; }

function nodeFill(n) {
  const mode = $("mode").value;
  if (mode.startsWith("seed:")) {
    const s = mode.slice(5), ft = (D.exposure[s] || {})[n];
    return {fill: ft !== undefined && ft <= tick ? seedColor[s] : "var(--node-empty)", fresh: ft === tick};
  }
  if (mode.startsWith("probe:")) {
    const p = mode.slice(6), byTick = (D.probes[p] || {})[n] || {};
    const ts = Object.keys(byTick).map(Number).filter(t => t <= tick);
    if (!ts.length) return {fill: "var(--node-empty)"};
    const ans = byTick[Math.max(...ts)], opts = probeOptions(p), i = opts.indexOf(ans);
    return {fill: i < 0 ? "var(--muted)" : D.colors[i % D.colors.length]};
  }
  return {fill: "var(--node-empty)"};
}
function probeOptions(p) {
  if (D.probe_options[p]) return D.probe_options[p];
  const s = new Set(); Object.values(D.probes[p]).forEach(bt => Object.values(bt).forEach(a => a && s.add(a)));
  return [...s].sort();
}

function renderLegend() {
  const mode = $("mode").value, L = $("legend");
  if (mode.startsWith("seed:")) {
    const s = mode.slice(5), n = Object.values(D.exposure[s] || {}).filter(t => t <= tick).length;
    L.innerHTML = `<span><span class="sw" style="background:${seedColor[s]}"></span>has read something descended from "${esc(s)}" (${n}/${names.length})</span>
      <span><span class="sw" style="background:var(--node-empty)"></span>not yet</span>
      <span>ring = first exposed this tick · arrows = messages sent this tick, colored by origin</span>`;
  } else {
    const p = mode.slice(6);
    L.innerHTML = probeOptions(p).map((o, i) => `<span><span class="sw" style="background:${D.colors[i % D.colors.length]}"></span>${esc(o)}</span>`).join("")
      + `<span><span class="sw" style="background:var(--muted)"></span>unparsed</span><span>latest answer at or before this tick</span>`;
  }
}

function render() {
  $("tick").value = tick; $("tickLabel").textContent = `tick ${tick} / ${D.steps - 1}`;
  names.forEach(n => {
    const {fill, fresh} = nodeFill(n);
    nodeEl[n].setAttribute("fill", fill);
    nodeEl[n].classList.toggle("sel", n === selected);
    const mode = $("mode").value;
    ringEl[n].setAttribute("stroke", fresh ? seedColor[mode.slice(5)] : "none");
  });
  gFlows.innerHTML = "";
  const now = D.messages.filter(m => m.tick === tick);
  now.forEach(m => {
    const [ax, ay] = P[m.sender], [bx, by] = P[m.recipient];
    const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
    const sx = ax + ux * 12, sy = ay + uy * 12, ex = bx - ux * 13, ey = by - uy * 13;
    const mx = (sx + ex) / 2 - uy * 18, my = (sy + ey) / 2 + ux * 18;
    const path = document.createElementNS(NS, "path");
    path.setAttribute("d", `M${sx},${sy} Q${mx},${my} ${ex},${ey}`);
    path.setAttribute("class", "flow"); path.setAttribute("stroke", msgColor(m));
    path.setAttribute("marker-end", `url(#ah${colorIdxFor(m)})`);
    const t = document.createElementNS(NS, "title"); t.textContent = `${m.sender} → ${m.recipient}: ${m.content}`; path.appendChild(t);
    gFlows.appendChild(path);
  });
  const seedsNow = D.seeds.filter(s => s.tick === tick);
  $("msgs").innerHTML = seedsNow.map(s => `<div class="msg" style="border-color:${seedColor[s.id]}"><div class="meta">seed:${esc(s.id)} · ${esc(s.source)} → ${esc(s.targets.join(", "))}</div>${esc(s.content)}</div>`).join("")
    + (now.length ? now.map(m => `<div class="msg" style="border-color:${msgColor(m)}"><div class="meta">${esc(m.id)} · ${esc(m.sender)} → ${esc(m.recipient)}${m.based_on.length ? " · based on " + esc(m.based_on.join(", ")) : ""}${m.roots.length ? " · origin " + esc(m.roots.join(", ")) : ""}</div>${esc(m.content)}</div>`).join("")
       : (seedsNow.length ? "" : `<p class="empty">No messages sent at this tick.</p>`));
  renderAgent(); renderLegend();
}

function renderAgent() {
  if (!selected) return;
  const a = D.agents[selected], bt = D.beliefs[selected] || {};
  const ts = Object.keys(bt).map(Number).filter(t => t <= tick);
  const last = ts.length ? bt[Math.max(...ts)] : null, cur = bt[tick];
  const sent = D.messages.filter(m => m.tick === tick && m.sender === selected);
  const traits = Object.entries(a.traits).map(([k, v]) => `${esc(k)}: ${esc(v)}`).join(" · ") || "none";
  $("agentPanel").innerHTML = `<h2>${esc(selected)}</h2>
    <div class="kv">traits: ${traits}</div>
    <div class="kv">docs: ${esc(a.docs.join(", ") || "none")} · model: ${esc(a.model)}</div>
    <h2>Beliefs as of tick ${tick}</h2><div>${last ? esc(last.beliefs) || '<span class="empty">(empty)</span>' : '<span class="empty">has not acted yet</span>'}</div>
    ${cur && cur.note ? `<div class="kv">note: ${esc(cur.note)}</div>` : ""}
    ${cur && cur.error ? `<div class="kv">error: ${esc(cur.error)}</div>` : ""}
    <h2>Read this tick</h2><div class="kv">${cur ? esc(cur.read.join(", ")) || "nothing" : "did not act"}</div>
    <h2>Sent this tick</h2>${sent.map(m => `<div class="msg" style="border-color:${msgColor(m)}"><div class="meta">→ ${esc(m.recipient)}</div>${esc(m.content)}</div>`).join("") || '<p class="empty">nothing</p>'}`;
}

$("tick").addEventListener("input", e => { tick = +e.target.value; render(); });
$("mode").addEventListener("change", render);
$("play").addEventListener("click", () => {
  if (timer) { clearInterval(timer); timer = null; $("play").textContent = "Play"; return; }
  if (tick >= D.steps - 1) tick = 0;
  $("play").textContent = "Pause";
  timer = setInterval(() => { if (tick >= D.steps - 1) { $("play").click(); return; } tick++; render(); }, 900);
});
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") { tick = Math.min(D.steps - 1, tick + 1); render(); }
  if (e.key === "ArrowLeft") { tick = Math.max(0, tick - 1); render(); }
});
render();
</script>
</body>
</html>
