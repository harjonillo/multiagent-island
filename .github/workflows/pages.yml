# Build the island explorer from the committed runs and publish it on GitHub Pages.
#
# A run is published when its manifest.json and events.jsonl are committed under runs/ (everything
# else in a run directory stays ignored). The build makes no LLM calls. Mock-backend runs are left out.
# Repository settings: Pages > Build and deployment > Source: "GitHub Actions".

name: Explorer site

on:
  push:
    branches: [main]
    paths:
      - "runs/**"
      - "src/**"
      - "data/**"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install .
      - name: Build the site
        run: |
          mkdir -p runs
          llmabm site runs --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
