[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-abm"
version = "0.1.0"
description = "An agent-based model of an island where the villagers are LLMs"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
llmabm = "llmabm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"llmabm.island" = ["site_template.html"]
