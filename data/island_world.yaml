  stag beetle: {price: 2000, weight: 2, hours: [0, 24], habitat: trees, months: [7, 8]}
  golden stag: {price: 12000, weight: 0.3, hours: [17, 8], habitat: trees, months: [7, 8]}
  tarantula: {price: 8000, weight: 0.6, hours: [19, 4], habitat: ground, months: [11, 12, 1, 2, 3, 4]}
  snail: {price: 250, weight: 8, hours: [0, 24], habitat: rocks, weather: wet}
  citrus long-horned beetle: {price: 350, weight: 6, hours: [0, 24], habitat: stumps}

# Dig up a fossil and you get a plain "fossil": Nook's Cranny pays unassessed_price for it as it
# is. Blathers assesses fossils for free at the museum, which reveals the species; an assessed
# fossil sells for its own price below, kept within [min_price, max_price] after perturbation,
# and only an assessed fossil can be donated.
fossil_assessment: {unassessed_price: 400, min_price: 1000, max_price: 10000}

fossils:                           # name: sell price once assessed
  amber: 1200
  ammonite: 1100
  trilobite: 1300
  dinosaur track: 1000
  shark-tooth pattern: 1000
  coprolite: 1100
  archaeopteryx: 1300
  dunkleosteus: 3500
  ankylo skull: 3500
  t. rex skull: 6000
  stego skull: 5000
  ptera body: 4500

recipes:                           # name: {needs, price (sell value), makes (default 1)}
  # ASSUMPTION throughout: material costs and prices as remembered from ACNH, approximate.
  # Tools (see `tools` below). A ladder climbs one cliff tier and a vaulting pole jumps the river.
  # Two axes, as in ACNH: the stone axe only gathers wood; the axe (iron) also brings a tree down
  # when it takes the tree's last wood. Villagers start with the stone axe. The stone axe is made
  # from stone and the shovel from wood, so a broken axe or a broken shovel alone never leaves a
  # villager unable to make a new one. ASSUMPTION: costs.
  shovel: {needs: {hardwood: 5}, price: 200}
  stone axe: {needs: {stone: 5}, price: 150}
  axe: {needs: {wood: 3, iron nugget: 1}, price: 300}
  fishing rod: {needs: {wood: 4}, price: 150}
  net: {needs: {softwood: 4}, price: 150}
  ladder: {needs: {wood: 4, hardwood: 4, softwood: 4}, price: 600}
  vaulting pole: {needs: {wood: 5}, price: 300}
  # Furniture (what can go outside is set under `items`).
  log stool: {needs: {wood: 3}, price: 360}
  log bench: {needs: {wood: 4, hardwood: 2}, price: 480}
  wooden chair: {needs: {wood: 4, softwood: 2}, price: 540}
  wooden bookshelf: {needs: {wood: 6, hardwood: 4}, price: 900}
  campfire: {needs: {wood: 3}, price: 180}
  stone stool: {needs: {stone: 3}, price: 340}
  stone lion-dog: {needs: {stone: 10}, price: 1200}
  clay furnace: {needs: {clay: 6, iron nugget: 2}, price: 2100}
  brick oven: {needs: {clay: 8, stone: 4}, price: 1600}
  street lamp: {needs: {iron nugget: 4, clay: 2}, price: 1900}
  iron worktable: {needs: {iron nugget: 5, wood: 4}, price: 2600}
  iron garden bench: {needs: {iron nugget: 3, hardwood: 4}, price: 1700}
  fruit basket: {needs: {apple: 6, softwood: 2}, price: 900}
  shell table: {needs: {giant clam: 2, venus comb: 2, conch: 1}, price: 2400}
  gold crown: {needs: {gold nugget: 6}, price: 67000}
  golden candlestick: {needs: {gold nugget: 1, iron nugget: 3}, price: 12000}
  ironwood dresser: {needs: {iron nugget: 4, hardwood: 8, wood: 4}, price: 3400}
  # Fences: one craft makes several pieces; each piece fills one tile.
  simple wooden fence: {needs: {wood: 3}, price: 60, makes: 5}
  # Bait, as in ACNH: anyone who has dug up a manila clam knows it (see island.clams_per_day).
  fishing bait: {needs: {manila clam: 1}, price: 75}
  stone fence: {needs: {stone: 3}, price: 75, makes: 5}
  iron fence: {needs: {iron nugget: 2}, price: 150, makes: 5}

recipes_known_at_start: 3          # each villager starts knowing this many random recipes (never tools)
starter_recipes: [simple wooden fence]   # everyone knows these from day 0

# Tools wear out. Everyone starts with one of each basic tool (a stone axe, not the axe); when
# one breaks, its recipe card is always for sale at Nook's Cranny, as is the axe's. A use is one
# action that needs the tool (either axe: chop_wood; shovel: mine_rock, dig_fossil, dig_stump,
# break_rock; fishing rod: fish; net: catch_bug), or one trip whose route climbs a cliff (ladder)
# or jumps the river (pole).
tools:
  uses: 30
  start_with: [shovel, stone axe, fishing rod, net, ladder, vaulting pole]

# What each item is, for the things that matter in space. Anything not listed is a plain
# item you can carry, sell, give or trade. kind: furniture | fence | seeds | sapling | tool.
# size is [width, height] in tiles; outdoor: false means it can't be placed outside.
items:
  log stool: {kind: furniture}
  log bench: {kind: furniture, size: [2, 1]}
  wooden chair: {kind: furniture}
  wooden bookshelf: {kind: furniture, size: [2, 1]}
  campfire: {kind: furniture}
  stone stool: {kind: furniture}
  stone lion-dog: {kind: furniture}
  clay furnace: {kind: furniture}
  brick oven: {kind: furniture, size: [2, 2]}
  street lamp: {kind: furniture}
  iron worktable: {kind: furniture, size: [2, 1]}
  iron garden bench: {kind: furniture, size: [2, 1]}
  fruit basket: {kind: furniture}
  shell table: {kind: furniture, size: [2, 1]}
  gold crown: {kind: furniture}
  golden candlestick: {kind: furniture}
  ironwood dresser: {kind: furniture, size: [2, 1]}
  wooden mini table: {kind: furniture}
  garden lantern: {kind: furniture}
  ceiling fan: {kind: furniture, outdoor: false}
  record player: {kind: furniture}
  simple wooden fence: {kind: fence}
  stone fence: {kind: fence}
  iron fence: {kind: fence}
  tulip seeds: {kind: seeds, grows: tulips}
  cosmos seeds: {kind: seeds, grows: cosmos}
  pansy seeds: {kind: seeds, grows: pansies}
  hyacinth seeds: {kind: seeds, grows: hyacinths}
  sapling: {kind: sapling}
  shovel: {kind: tool}
  stone axe: {kind: tool}
  axe: {kind: tool}
  fishing rod: {kind: tool}
  net: {kind: tool}
  ladder: {kind: tool}
  vaulting pole: {kind: tool}
  island map: {kind: map}          # Tom Nook or Isabelle hand one out when asked; carried, it shows the layout
  fishing bait: {kind: bait}       # fish with "bait": true and a fish is sure to appear (it can still get away)

# Mental energy: one daily budget of tokens per villager for everything they read, think and
# say. Off here; a scenario turns it on with `mental_energy: {enabled: true}`. One point is about
# tokens_per_point tokens (characters / 4) of what changes from call to call (the situation and
# the villager's own nightly page) plus everything they write; the fixed rules aren't charged.
mental_energy:
  enabled: false
  daily: 150                       # points per villager per day (150 x 100 = about 15k tokens)
  tokens_per_point: 100
  carry_over: 0.0                  # share of unspent energy kept for the next day

building:
  path_styles: [dirt, stone, brick, sand, terracotta]
  path_tiles_per_action: 30        # how much road one hour of work lays
  path_step_cost: 1.0              # ACNH: paths don't change walking speed. Below 1 makes roads faster.
  flower_bloom_days: 3             # seeds sprout, then bloom after this many days
  rock_respawn_days: 3             # a broken rock comes back somewhere else after this many days
  owner_only_pickup: true          # only the villager who placed something can pick it up or remove it
  max_place_distance: 12           # how far from the named landmark things can be put
  road_bias: 0.8                   # wandering villagers on or next to a path step onto it this often

# Able Sisters' clothing. These are placeholders: replace them with your own designs.
# Each entry: price (bells), slot (top, bottom, dress, hat, shoes, accessory), and a short
# description, which is what villagers see. Clothing can be bought, worn, gifted, traded and
# sold back at a quarter of its price.
clothing:
  straw hat: {price: 800, slot: hat, description: a wide-brimmed straw hat}
  sundress: {price: 1400, slot: dress, description: a light cotton sundress}
  denim jacket: {price: 2200, slot: top, description: a faded denim jacket}
  raincoat: {price: 1600, slot: top, description: a bright yellow raincoat}
  rose crown: {price: 1200, slot: hat, description: a crown of small roses}
  bowler hat: {price: 900, slot: hat, description: a black bowler hat}
  kimono: {price: 4800, slot: dress, description: a patterned kimono}
  tuxedo: {price: 3200, slot: top, description: a black tuxedo jacket}

shops:
  cranny:                          # Timmy and Tommy: buy anything at a fixed price, sell a small daily stock
    name: Nook's Cranny
    always: {sapling: 640}
    seeds_daily: 2                 # two kinds of flower seeds each day
    seeds_pool: {tulip seeds: 240, cosmos seeds: 240, pansy seeds: 240, hyacinth seeds: 240}
    sells_daily: 3                 # plus three rotating items
    stock_pool:
      fishing bait: 300
      wooden mini table: 1800
      garden lantern: 2200
      ceiling fan: 4600
      record player: 9800
      simple wooden fence: 100
      iron fence: 280
    sells_recipe_daily: true       # one random DIY recipe card per day (never a tool)
    recipe_price: 800              # ASSUMPTION: cheaper than ACNH's, so a card is worth buying
    tool_recipe_price: 200         # every tool's recipe card, always in stock
    tool_markup: 4                 # every tool, ready-made, always in stock at 4x its sell value
                                   # (so selling one back fetches what a crafted one does)
  able:
    name: Able Sisters
    sells_daily: 4                 # drawn from `clothing` above
