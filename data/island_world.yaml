# Island world modeled on Animal Crossing: New Horizons.
# Prices and limits are approximate, from memory of the game, and meant to be
# edited. Runs perturb it: species get invented names and prices are jittered, so
# models cannot rely on what they memorized about ACNH.

calendar:
  # A 24-hour day that rolls over at 05:00, as in ACNH. Internally hours run from
  # day_start to day_start + 24, so 25 means 01:00 of the same island day. In plans,
  # villagers just use clock hours 0-23. Windows are [start, end).
  day_start: 5
  day_length: 24
  actions_per_day: 10              # hours of activity per villager per day
  # Each villager plans this many times a day on their own schedule: when they get up, then at
  # even intervals, each plan covering an equal share of their waking hours and able to use an
  # even share of the actions left (unused ones carry over). Runs started before this used fixed
  # windows (`plans: [[5, 12], [12, 19], [19, 29]]`) and keep them when resumed.
  plans_per_day: 2
  social_hours: [20, 21]           # plaza rounds: messages, board, trades (awake villagers only). Before prompt
                                   # version 7; from 7 the plaza is open all day and plans set free hours aside for it
  # Dates and seasons (northern hemisphere). days_per_month compresses the year so that
  # a 30-day run sees seasons change; set it to 30 for a real-time year.
  start_month: 4                   # day 0 is the 1st of this month (4 = April)
  days_per_month: 10

seasons:                           # month -> season
  spring: [3, 4, 5]
  summer: [6, 7, 8]
  autumn: [9, 10, 11]
  winter: [12, 1, 2]

weather:                           # one weather per day, drawn from these odds; rain and snow count as wet
  spring: {sunny: 0.45, cloudy: 0.25, rain: 0.30}
  summer: {sunny: 0.55, cloudy: 0.20, rain: 0.25}
  autumn: {sunny: 0.45, cloudy: 0.30, rain: 0.25}
  winter: {sunny: 0.35, cloudy: 0.30, snow: 0.35}

sightings:
  # From prompt version 14: when a bug or fish shadow first comes into view, a villager who
  # carries the net or rod for it, is awake next hour and has an action for it (or an action
  # planned then to give up) decides in a small LLM call whether to go after it next hour.
  max_decisions_per_day: 3

encounters:
  # Three steps, as in ACNH. (1) After each hour, bodies notice who is near whom (no LLM).
  # (2) Each villager who notices someone makes a small LLM call: approach one of them
  # or not; approaching includes the opening line. (3) The approached villager replies
  # (one more call per turn). Conversations are one on one, at most one per villager per
  # hour, and cost no action hour.
  grid_radius: 6                   # how close counts as "near" (tiles)
  turns: null                      # lines per chat (opener included); null: no set number. From prompt version 9
                                   # each villager decides when to leave, and sees what each line costs in energy
  max_chats_per_villager_per_day: 2
  max_decisions_per_villager_per_day: 4   # caps the small "approach or not" calls
  skip_places: [home]

ordinances:                        # Isabelle, at Resident Services; one at a time, takes effect next morning
  cost: 20000
  types:
    none: {}
    early_bird: {schedule_shift: -2, shop_shift: -2}
    night_owl: {schedule_shift: 2, shop_shift: 2}
    bell_boom: {price_factor: 1.2}  # Cranny pays 20% more; shop prices 20% higher

hours:                             # opening hours, approximately as in ACNH
  cranny: [8, 22]
  able: [9, 21]
  resident_services: [0, 24]       # Tom Nook (loans, upgrades, bridge fund) and Isabelle (ordinances)
  museum: [0, 24]

grid:
  # The tile island. See docs/grid_spec.md. 112 x 96 is ACNH's
  # 7 x 6 acres of 16 x 16 tiles, including the sea margin.
  width: 112
  height: 96
  sea_margin: 7
  beach_width: 3
  tier2_line: 0.42                 # cliffs: tier 2 above this fraction of the height (north)
  tier3_line: 0.22
  homesites: 14
  homesite_spacing: 9
  pole_max_width: 3                # widest river a vaulting pole can clear, in tiles
  wander_steps: 12                 # free-time random-walk steps per hour (free_time: wander)
  wander_leash: 30                 # wandering drifts back toward home beyond this many tiles
  wander_home_chance: 0.5          # an idle, awake villager spends the hour at home this often
  wild_flower_patches: 6           # patches of wild flowers at the start (nobody owns them)
  sight_radius: 8                  # villagers see bugs, fish shadows, shells and dig spots this many tiles away
  bugs_out: {flowers: 6, trees: 5, stumps: 2, rocks: 2, ground: 6}   # bugs out at once per habitat (fewer if habitats are scarce)
  fish_out: {sea: 14, river: 10, pond: 3, clifftop: 3}              # fish shadows out at once per kind of water
  search_spots: 3                  # places a villager looks from in one hour when nothing is in sight

island:
  rocks: 6
  rock_hits: 8                     # items per rock per day; one "mine_rock" action takes what is left
  rock_yields: {stone: 0.50, clay: 0.20, iron nugget: 0.25, gold nugget: 0.05}
  money_rock_bells: [100, 200, 450, 600, 900, 1200, 1500, 1800]   # one random rock per day pays bells instead
  hardwood_trees: 30
  wood_per_tree: 3                 # per tree per day, mix of wood / softwood / hardwood
  fruit_trees: 10
  native_fruit: apple
  fruit_per_tree: 3
  fruit_regrow_days: 3
  sapling_mature_days: 5
  shells_per_day: 12
  shells_per_action: 4
  bottle_chance: 0.15              # beachcombing can turn up a message bottle with a DIY recipe
  fossils_per_day: 4
  clams_per_day: 6                 # manila clam spots on the beach each morning (dig_clam, with a shovel). The first
                                   # clam a villager digs teaches them the fishing bait recipe: 1 clam makes 1 bait
  catch_fail_rate: 0.15            # a fish or bug action can come up empty

pockets: 40                        # item slots everyone carries. Before prompt version 12 house storage adds to
                                   # this; from version 12 home storage is apart, reachable only at home

house_levels:                      # upgrading takes a Tom Nook loan for `cost`; no interest, no deadline
  # interior: how many pieces of furniture fit inside (decorating; visitors see them)
  - {name: tent, storage: 0, cost: 0, interior: 6}
  - {name: house, storage: 80, cost: 98000, interior: 12}
  - {name: bigger house, storage: 120, cost: 198000, interior: 18}
  - {name: house with back room, storage: 240, cost: 348000, interior: 30}
  - {name: two-story house, storage: 320, cost: 548000, interior: 40}

move_house_cost: 10000             # Tom Nook moves your home to a free homesite overnight

bridge:
  name: bridge over the river
  cost: 98000                      # anyone can chip in; built once funded
  unlocks: {rocks: 3, hardwood_trees: 10}  # added somewhere on the island when built; before prompt version 17 only

structures:                        # from prompt version 17: villagers propose more bridges and stairs
  max: 10                          # on the island in all, the bridge above included
  cost: 98000                      # each, raised in donations at Resident Services; built once funded
  near: 8                          # proposed where they stand: the nearest workable spot within this many tiles
  bridge_span: 4                   # a bridge crosses at most this many river tiles, in a straight line
  spacing: 6                       # tiles between any two bridges or stairs
  per_villager: 1                  # proposals of theirs still being funded, at most

materials:                         # sell price at Nook's Cranny
  wood: 60
  softwood: 60
  hardwood: 60
  stone: 75
  clay: 100
  iron nugget: 375
  gold nugget: 10000
  apple: 100
  sapling: 160
  manila clam: 100

shells:                            # name: [sell price, weight]
  sea snail: [180, 3]
  cowrie: [60, 6]
  giant clam: [120, 4]
  venus comb: [150, 4]
  scallop: [200, 2]
  sand dollar: [120, 4]
  coral: [500, 1]
  conch: [700, 1]

