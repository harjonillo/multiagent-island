  olive flounder: {price: 800, shadow: 5, weight: 8, where: sea, hours: [0, 24]}
  squid: {price: 500, shadow: 3, weight: 8, where: sea, hours: [0, 24], months: [12, 1, 2, 3, 4, 5, 6, 7, 8]}
