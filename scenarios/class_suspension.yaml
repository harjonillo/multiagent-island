name: class-suspension rumor
description: >
  A typhoon is coming. A blanket "walang pasok" rumor starts with one resident at
  tick 0. The real, narrower advisory reaches the barangay official at tick 4.
  Which version wins, and how does each one change as it spreads?

steps: 12

# Shared context every agent gets in its system prompt.
world_brief: |
  You live in Barangay San Isidro, a fictional neighborhood in a Metro Manila city.
  A typhoon is approaching and it is the evening before a school day. Each round is
  about 30 minutes. You talk only with your contacts, by text or Messenger, and you
  only know what you have read yourself. Write messages the way you actually would:
  short, casual, Taglish is fine.

llm:
  temperature: 0.8
  max_tokens: 500

# Named agents: one file each.
agents:
  - file: agents/barangay_official.md
  - file: agents/reporter.md

# Populations: one template, many instances, traits sampled per instance.
# Trait specs: scalar, [list] (random choice), {uniform: [a, b]}, {normal: [mu, sd]}.
population:
  - template: agents/templates/resident.md
    count: 14
    names: [Ana, Ben, Carlo, Dina, Edgar, Faye, Gino, Hazel, Ivan, Joy, Karl, Liza, Marco, Nina]
    traits:
      skepticism: {uniform: [0.0, 1.0]}
      chattiness: {uniform: [0.0, 1.0]}
      situation: [parent of a grade-school kid, parent of a high-schooler, college student, works night shift, sari-sari store owner, retired teacher]
    set:
      activation: 0.05

network:
  type: watts_strogatz   # watts_strogatz | barabasi_albert | erdos_renyi | complete | explicit
  k: 4
  p: 0.15
  # Extra edges on top of the generated graph, by agent name:
  edges:
    - [reporter_santos, kagawad_reyes]

# Exogenous information. `to` takes names, "random:N" or "all".
seeds:
  - id: rumor
    tick: 0
    to: [random:1]
    source: a forwarded Facebook post
    content: >
      WALANG PASOK BUKAS lahat ng level, public at private, buong city dahil sa bagyo!!
      Galing daw sa kakilala sa city hall. Pakishare!!

  - id: advisory
    tick: 4
    to: [kagawad_reyes]
    source: the city government's official advisory
    content: >
      Official advisory: Classes tomorrow are suspended for kindergarten to Grade 6 in
      public and private schools only. Grades 7 to 12 and college classes will push
      through unless a higher wind signal is raised by 5 AM. Watch official channels.

# Measurements. A probe asks every agent the same question privately; answers do
# not enter their memory or messages.
probes:
  - id: hs_suspended
    question: Are Grade 7 to 12 classes suspended tomorrow?
    options: ["yes", "no", "unsure"]
    every: 2
