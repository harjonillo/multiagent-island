type: island
name: island with goals
description: >
  Same island and villagers as the baseline. Each villager gets one personal goal
  of the kind a human player sets for themselves, plus a shared wish for the museum.

world: data/island_world.yaml
world_facts: canonical

# Space: "grid" is the ACNH-style tile island (cliffs, river, pond, scattered trees and
# rocks; ladder and vaulting pole needed to get around). "places" is the simple map of
# named points. free_time: "wander" has idle villagers take short random walks (as
# ACNH villagers do); "home" keeps them home. This changes how often villagers meet.
space: grid
free_time: wander
days: 30
# calendar:                    # optional overrides of the clock in data/island_world.yaml
#   actions_per_day: 10
#   social_hours: [20, 21]
start_bells: 1000

# Day 0: how villagers arrive. "together": everyone lands at the start of the window
# and picks a homesite one after another in random order. "trickle": each villager
# lands at a random hour in the window. Clock hours.
arrivals:
  mode: trickle
  window: [5, 18]

# Isabelle (an LLM call) writes a report of each day from the full log, for you.
# announce: true also has her write the next morning's announcement to villagers
# from public information only. That puts an LLM between events and what villagers
# hear, so treat it as its own experimental condition.
# mental_energy: {enabled: true, daily: 150}   # daily token budget; see the world file

isabelle:
  summary: true
  announce: false
  backend: null      # null = same backend as the villagers
memory_size: 15

villagers: villagers/cast.yaml
villager_template: villagers/villager.md

brief: ""

goals:
  shared:
    - You would love the island's museum to be as full as possible.
  # Either name a goal per villager under `personal`, or give a pool to sample from.
  # Names listed under `personal` override the pool.
  personal_pool:
    - Upgrade your home to a bigger house by the end of the month.
    - Pay off any loan you take and get your home as big as you can.
    - Save up as many bells as you can.
    - Own at least five pieces of furniture you crafted yourself.
    - Collect a complete outfit from the Able Sisters.
    - Learn as many DIY recipes as you can.
  personal: {}

llm:
  temperature: 0.8
  max_tokens: 700
