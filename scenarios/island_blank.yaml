type: island
name: blank villagers
description: >
  Ten identical villagers with no stated personality, no goals and the same schedule.
  Each night they write a private description of who they are, which shapes the next
  day. Does personality emerge, and does it follow the environment (homesite, river
  side, luck, who they meet) or just noise?

world: data/island_world.yaml
world_facts: perturbed          # invented species and prices, so ACNH knowledge doesn't steer them
space: grid
free_time: wander
days: 30
start_bells: 1000

arrivals:
  mode: trickle
  window: [5, 18]

# The nightly reflection. One call per villager after the day ends: they write whatever
# they like, free-form and private, with no topics or questions given. It replaces the
# previous night's page and is in their prompt from the next day. max_words caps length only.
reflection:
  enabled: true
  max_words: 150

# Mental energy: a daily token budget each villager divides between planning, private
# thinking and talking (see mental_energy in the world file). Everyone starts with the same
# split; whether some become "talkers" and others "planners" is part of what emerges.
mental_energy:
  enabled: true
  daily: 150

isabelle:
  summary: true
  announce: false
  backend: null
memory_size: 15

villagers: villagers/blank_cast.yaml
villager_template: villagers/blank.md
brief: ""

llm:
  temperature: 0.8
  max_tokens: 700
