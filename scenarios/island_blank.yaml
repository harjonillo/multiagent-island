type: island
name: blank villagers
description: >
  Ten identical villagers with no stated personality, no goals and the same schedule.
  They are told only what they can't find out by trying, and learn the rest on the island.
  Each night they can write a private page, which they see the next day. Does personality
  emerge, and does it follow the environment (homesite, river side, luck, who they meet)
  or just noise?

world: data/island_world.yaml
free_time: wander
days: 30
start_bells: 1000
# Day 0: everyone lands together at 05:00 on a homesite drawn at random. They can move
# later through Tom Nook (move_house_cost in the world file).

# The nightly reflection. One call per villager after the day ends: they write whatever
# they like, free-form and private, with no topics or questions given. It replaces the
# previous night's page and is in their prompt from the next day. max_words caps length only.
reflection:
  enabled: true
  max_words: 150

# Mental energy: one daily token budget per villager for everything they read, think and say
# (see mental_energy in the world file). From prompt version 7 they're told it is one daily total
# spent inwardly (planning, thinking, writing) or outwardly (talking, the plaza, letters), and each
# morning's plan splits it, as a plan, not a limit. Before that, a plan could skip the plaza,
# skip writing, or follow habit next time for free. What they spend it on is part of what emerges.
mental_energy:
  enabled: true
  daily: 150
  charge_reasoning: false   # true: a reasoning model's hidden thinking also costs energy (it is recorded either way)

isabelle:
  summary: true
  announce: false
  backend: null
# Long-term memory. Each night, after their page, villagers can name up to `picks` things to
# hold on to: something from the day in their own words, or the number of an older memory still
# on their mind. Memories fade along a forgetting curve (strength exp(-days / stability)); each
# time one is picked again its stability doubles. Below `threshold` it is forgotten. Notes written
# during the day last `notes_days` days unless picked. At most `shown` memories are in a prompt.
# Without this block, villagers keep their last memory_size notes instead.
memory:
  mode: consolidate
  picks: 3
  shown: 10
  stability: 4
  threshold: 0.25
  notes_days: 2
memory_size: 15

villagers: villagers/blank_cast.yaml
villager_template: villagers/blank.md
brief: ""

llm:
  temperature: 0.8
  max_tokens: 1200
